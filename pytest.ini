[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI defaults: Headed browser, chromium, HTML report with log capture
addopts = 
    --headed 
    --browser chromium 
    --html=reports/report.html 
    --video=retain-on-failure 
    --output=reports/test-results 
    --log-cli-level=INFO 
    --log-format="%(asctime)s [%(levelname)s] (%(filename)s:%(lineno)s) %(message)s" 
    --log-date-format="%Y-%m-%d %H:%M:%S"
    -v
